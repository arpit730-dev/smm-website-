<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MultiScreen Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <h1>MultiScreen Hub</h1>

    <div class="buttons">
        <button id="addScreen">➕ Add Screen</button>
        <button id="clearAll">🗑 Clear All</button>
    </div>
</header>


<section class="settings">

    <label>
        Grid:
        <select id="gridSize">
            <option value="auto">Auto</option>
            <option value="1">1 Column</option>
            <option value="2">2 Columns</option>
            <option value="3">3 Columns</option>
            <option value="4">4 Columns</option>
        </select>
    </label>

</section>


<main id="screenContainer">

    <!-- Screens yaha JavaScript se add hongi -->
<div class="screen-card">

    <div class="screen-header">
        <h3>Screen #1</h3>
        <button class="lock-btn">🔒</button>
    </div>


    <div class="url-box">

        <input 
            type="text" 
            class="video-url" 
            placeholder="Paste URL here..."
        >

        <button class="load-btn">
            ▶ Load
        </button>

    </div>


    <div class="player-box">

        <iframe 
            class="video-frame"
            src=""
            allowfullscreen>
        </iframe>

        <div class="error-box">
            <p>
                Website can't be embedded.
            </p>

            <button class="open-new">
                ↗ Open in New Tab
            </button>
        </div>

    </div>


    <div class="screen-actions">

        <button class="fullscreen-btn">
            ⛶ Fullscreen
        </button>

        <button class="remove-btn">
            ❌ Remove
        </button>

    </div>


</div>
</main>


<script src="script.js"></script>

</body>
</html>
