<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiScreen Hub - All Sites</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #111; color: white; }
        .topbar { padding: 15px; background: #1c1c1c; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 10px; }
        .topbar h1 { margin: 0; font-size: 22px; }
        .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        button { cursor: pointer; border: none; padding: 8px 12px; border-radius: 6px; background: #333; color: white; transition: 0.2s; }
        button:hover { background: #555; }
        .settings { padding: 10px; background: #181818; }
        #screenContainer { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; padding: 15px; }
        .screen-card { background: #1b1b1b; border-radius: 10px; padding: 12px; }
        .screen-header { display: flex; justify-content: space-between; align-items: center; }
        .screen-header h3 { margin: 5px 0; }
        .url-box { display: flex; gap: 8px; margin: 10px 0; }
        .video-url { flex: 1; padding: 10px; border-radius: 5px; border: none; background: #2a2a2a; color: white; }
        .video-url:focus { outline: 2px solid #4CAF50; background: #333; }
        .player-box { width: 100%; height: 300px; background: black; position: relative; border-radius: 5px; overflow: hidden; }
        .video-frame { width: 100%; height: 100%; border: 0; }
        .error-box { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding: 20px; text-align: center; }
        .error-box.show { display: flex; }
        .error-box p { color: #ff6b6b; margin: 0; font-size: 15px; }
        .error-box .sub-text { color: #aaa; font-size: 13px; }
        .error-box .open-new { background: #4CAF50; padding: 12px 28px; border-radius: 5px; border: none; color: white; cursor: pointer; font-size: 14px; }
        .error-box .open-new:hover { background: #45a049; }
        .screen-actions { margin-top: 10px; display: flex; justify-content: space-between; gap: 10px; }
        .screen-actions button { flex: 1; }
        .remove-btn { background: #dc3545; }
        .remove-btn:hover { background: #c82333; }
        .fullscreen-btn { background: #17a2b8; }
        .fullscreen-btn:hover { background: #138496; }
        .load-btn { background: #28a745; }
        .load-btn:hover { background: #218838; }
        .badge { font-size: 11px; background: #333; padding: 2px 8px; border-radius: 10px; color: #aaa; }
        @media(max-width:600px) { .topbar { flex-direction: column; align-items: stretch; } .buttons { justify-content: center; } #screenContainer { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header class="topbar">
    <h1>🌐 MultiScreen Hub</h1>
    <div class="buttons">
        <button id="addScreen">➕ Add Screen</button>
        <button id="clearAll">🗑 Clear All</button>
    </div>
</header>

<section class="settings">
    <label>
        Grid:
        <select id="gridSize">
            <option value="auto">Auto</option>
            <option value="1">1 Column</option>
            <option value="2">2 Columns</option>
            <option value="3">3 Columns</option>
            <option value="4">4 Columns</option>
        </select>
    </label>
    <span style="margin-left:20px;color:#888;">💡 Koi bhi URL daalo - YouTube, Wikipedia, ya koi bhi site</span>
</section>

<main id="screenContainer"></main>

<script>
const container = document.getElementById("screenContainer");
const addBtn = document.getElementById("addScreen");
const clearBtn = document.getElementById("clearAll");
const gridSize = document.getElementById("gridSize");

let count = 0;
const max = 50;

// YouTube URL to Embed URL
function getYouTubeEmbedUrl(url) {
    let cleanUrl = url.split('?')[0]; // Remove tracking params
    const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([^&\s?#]+)/,
        /youtube\.com\/shorts\/([^&\s?#]+)/,
        /youtube\.com\/live\/([^&\s?#]+)/
    ];
    for (let pattern of patterns) {
        let match = cleanUrl.match(pattern);
        if (match) {
            return `https://www.youtube.com/embed/${match[1]}`;
        }
    }
    return null;
}

// Check if URL is YouTube
function isYouTube(url) {
    return url.includes('youtube.com') || url.includes('youtu.be');
}

function addScreen() {
    if (count >= max) {
        alert("❌ Maximum 50 screens allowed!");
        return;
    }
    count++;

    let card = document.createElement("div");
    card.className = "screen-card";

    card.innerHTML = `
        <div class="screen-header">
            <h3>📺 Screen #${count}</h3>
            <button class="remove-btn" style="background:#dc3545;">✖ Remove</button>
        </div>

        <div class="url-box">
            <input class="video-url" placeholder="Paste any URL (YouTube, Wikipedia, etc.)" style="background:#2a2a2a;color:white;padding:10px;border-radius:5px;border:none;flex:1;">
            <button class="load-btn" style="background:#28a745;padding:10px 15px;">▶ Load</button>
        </div>

        <div class="player-box">
            <iframe class="video-frame" src="" allowfullscreen></iframe>
            <div class="error-box show">
                <p>⚠️ This site can't be embedded</p>
                <p class="sub-text">Some websites block embedding for security reasons</p>
                <button class="open-new" style="background:#4CAF50;padding:12px 28px;border-radius:5px;border:none;color:white;cursor:pointer;font-size:14px;">↗ Open in New Tab</button>
            </div>
        </div>

        <div class="screen-actions">
            <button class="fullscreen-btn" style="background:#17a2b8;">⛶ Fullscreen</button>
        </div>
    `;

    container.appendChild(card);

    let input = card.querySelector(".video-url");
    let load = card.querySelector(".load-btn");
    let frame = card.querySelector(".video-frame");
    let errorBox = card.querySelector(".error-box");
    let openNew = card.querySelector(".open-new");

    function loadUrl() {
        let url = input.value.trim();

        if (!url) {
            alert("⚠️ Please paste a URL first!");
            return;
        }

        // Add https:// if missing
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
            url = "https://" + url;
        }

        let finalUrl = url;

        // If YouTube, convert to embed URL
        if (isYouTube(url)) {
            let embedUrl = getYouTubeEmbedUrl(url);
            if (embedUrl) {
                finalUrl = embedUrl;
            }
        }

        frame.src = finalUrl;
        
        // Hide error initially
        errorBox.classList.remove("show");

        // Check if site allows embedding
        setTimeout(() => {
            try {
                // Try to access iframe content
                let test = frame.contentWindow.document;
                errorBox.classList.remove("show");
            } catch (e) {
                // Site blocks embedding - show error
                errorBox.classList.add("show");
            }
        }, 2000);
    }

    load.onclick = loadUrl;

    input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            loadUrl();
        }
    });

    // Open in new tab - works for ALL sites
    openNew.onclick = function() {
        let url = input.value.trim();
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
            url = "https://" + url;
        }
        window.open(url, "_blank");
    };

    // Fullscreen
    card.querySelector(".fullscreen-btn").onclick = function() {
        let playerBox = card.querySelector(".player-box");
        if (playerBox.requestFullscreen) {
            playerBox.requestFullscreen();
        } else if (playerBox.webkitRequestFullscreen) {
            playerBox.webkitRequestFullscreen();
        } else if (playerBox.msRequestFullscreen) {
            playerBox.msRequestFullscreen();
        }
    };

    // Remove
    card.querySelector(".remove-btn").onclick = function() {
        card.remove();
        count--;
    };

    // Auto-load if URL is there
    if (input.value.trim()) {
        loadUrl();
    }
}

addBtn.onclick = addScreen;

clearBtn.onclick = function() {
    if (confirm("Remove all screens?")) {
        container.innerHTML = "";
        count = 0;
    }
};

gridSize.onchange = function() {
    let value = gridSize.value;
    if (value === "auto") {
        container.style.gridTemplateColumns = "repeat(auto-fit, minmax(350px, 1fr))";
    } else {
        container.style.gridTemplateColumns = `repeat(${value}, 1fr)`;
    }
};

// Add first screen
addScreen();
</script>

</body>
</html>
